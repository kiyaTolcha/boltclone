<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>BOLTCLONE DevTools</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 16px; }
      h1 { margin: 0 0 10px; }
      p { margin: 4px 0; }
      .status { padding: 10px; background: #f4f4f4; border: 1px solid #ddd; border-radius: 4px; }
      .actions { margin-top: 12px; }
      button { margin-right: 8px; }
    </style>
  </head>
  <body>
    <h1>BOLTCLONE DevTools</h1>
    <p class="status">Extension devtools panel loaded.</p>
    <div class="actions">
      <button id="openPanel">Open BOLTCLONE Panel</button>
    </div>
    <script>
      document.getElementById('openPanel').addEventListener('click', async () => {
        try {
          const url = chrome.runtime.getURL('panel.html');
          await chrome.tabs.create({ url });
        } catch (err) {
          console.error('DevTools open panel failed:', err);
          alert('Could not open panel: ' + err.message);
        }
      });
    </script>
  </body>
</html>
